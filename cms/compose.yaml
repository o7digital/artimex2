name: artimex-commerce-dev
services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: artimex
      POSTGRES_USER: artimex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [database:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U artimex -d artimex']
      interval: 5s
      timeout: 5s
      retries: 15
  directus:
    image: directus/directus:12.6.1
    ports: ['127.0.0.1:8055:8055']
    depends_on:
      database: { condition: service_healthy }
    environment:
      HOST: 0.0.0.0
      PORT: '8055'
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      SECRET: ${SECRET:?Set SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: '5432'
      DB_DATABASE: artimex
      DB_USER: artimex
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POOL__MIN: '0'
      DB_POOL__MAX: '5'
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_DRIVER: local
      STORAGE_LOCAL_ROOT: /directus/uploads
    volumes: [uploads:/directus/uploads]
volumes:
  database:
  uploads:
